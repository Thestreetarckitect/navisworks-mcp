name: verify
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checksums, secrets, personal paths, file sizes
        run: python3 tools/verify.py
      - name: Python syntax check
        run: python3 -m py_compile server_http.py make_clash_report.py
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in 'Install.ps1','Build.ps1','tools/verify.ps1') {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $errs | ForEach-Object { Write-Host "$f : $_" }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Verify checksums with PowerShell
        shell: pwsh
        run: ./tools/verify.ps1
